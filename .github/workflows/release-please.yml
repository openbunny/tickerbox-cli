name: release-please
# Manual only: opening the release PR needs the org setting "Allow GitHub
# Actions to create and approve pull requests", which is currently off for the
# openbunny org. Restore the push trigger once that setting is enabled.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      # Package name defaults to the repository name (tickerbox-cli); the
      # action's simple mode (release-type only) takes no package-name input.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: go
