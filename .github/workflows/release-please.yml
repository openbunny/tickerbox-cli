name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # pushes the release commit and tag
      pull-requests: write # opens and updates the release PR
      issues: write # comments on issues closed by the release
    uses: openbunny/.github/.github/workflows/reusable-release-please.yml@2383033519e5dd89bfd4e832659933a145e7acde # v0.2.0
    with:
      signoff: 'Robot <bot@fiona.sm>'
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
