name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # pushes the release commit and tag
      pull-requests: write # opens and updates the release PR
      issues: write # comments release links on issues the release closes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Manifest mode: read release-please-config.json and the manifest, which
      # carry release-as, bump-minor-pre-major, draft and the changelog path.
      # Passing release-type here instead would switch to simple mode and ignore
      # both files.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          signoff: 'Robot <bot@fiona.sm>'
          # A PAT in RELEASE_PLEASE_TOKEN makes the release PR and tag come from a
          # real user instead of github-actions[bot], so the PR's CI runs without
          # manual approval and the pushed tag triggers the release workflow (a
          # GITHUB_TOKEN-created tag does not). Without the secret it falls back to
          # GITHUB_TOKEN, and those two steps must be done by hand each release.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
