name: release-please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # pushes the release commit and tag
      pull-requests: write # opens and updates the release PR
      issues: write # comments on issues closed by the release
    uses: openbunny/.github/.github/workflows/reusable-release-please.yml@2050692900f7dcd883e416ebee37a1b97b119203 # v0.3.0
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
