# gosec runs directly and fails on findings. SARIF upload / CodeQL are omitted:
# code scanning needs GitHub Advanced Security on a private repo. Add CodeQL when
# the repository is made public, where code scanning is free.
name: Security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
