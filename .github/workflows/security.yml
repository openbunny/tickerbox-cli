# Security tools fail the job on findings. SARIF upload / CodeQL are omitted:
# code scanning needs GitHub Advanced Security, unavailable on a private repo.
# Add CodeQL when the repository is made public, where code scanning is free.
name: Security
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions: {}
concurrency:
  # Static per-file group: a tag-push release run calls ci, security,
  # gitleaks and reuse together; a shared group with cancel-in-progress
  # made the siblings cancel each other, so each names its own group.
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gosec:
    name: Gosec
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=go depName=github.com/securego/gosec/v2
      GOSEC_VERSION: v2.29.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - uses: ./.github/actions/install-go-tool # zizmor: ignore[self-repository] actionlint v1.7.12 rejects the $/ form; keep ./ until actionlint accepts it
        with:
          module: github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
      - name: gosec
        # G304 (file path from a variable) and G204 (subprocess with a variable)
        # are inherent to a CLI that reads and writes user-named files and opens
        # a browser; go.md forbids the #nosec comment that would suppress them
        # inline, so they are excluded here. -confidence=medium drops a
        # LOW-confidence G101 false positive on a plaintext-warning message.
        run: gosec -confidence=medium -exclude=G204,G304 ./...

  govulncheck:
    name: Govulncheck
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=go depName=golang.org/x/vuln
      GOVULNCHECK_VERSION: v1.8.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy -diff
        run: go mod tidy -diff
      - uses: ./.github/actions/install-go-tool # zizmor: ignore[self-repository] actionlint v1.7.12 rejects the $/ form; keep ./ until actionlint accepts it
        with:
          module: golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: govulncheck
        run: govulncheck ./...

  go-licenses:
    name: Go Licenses
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=go depName=github.com/google/go-licenses/v2
      GO_LICENSES_VERSION: v2.0.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - uses: ./.github/actions/install-go-tool # zizmor: ignore[self-repository] actionlint v1.7.12 rejects the $/ form; keep ./ until actionlint accepts it
        with:
          module: github.com/google/go-licenses/v2@${{ env.GO_LICENSES_VERSION }}
      - name: report dependency licenses
        run: go-licenses report ./...
      - name: check dependency licenses
        run: go-licenses check ./...
