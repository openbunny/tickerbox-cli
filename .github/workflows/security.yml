# Security tools fail the job on findings. SARIF upload / CodeQL are omitted:
# code scanning needs GitHub Advanced Security, unavailable on a private repo.
# Add CodeQL when the repository is made public, where code scanning is free.
name: Security
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gosec:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=go depName=github.com/securego/gosec/v2
      GOSEC_VERSION: v2.29.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-gosec-${{ env.GOSEC_VERSION }}
      - name: gosec
        # G304 (file path from a variable) and G204 (subprocess with a variable)
        # are inherent to a CLI that reads and writes user-named files and opens
        # a browser; go.md forbids the #nosec comment that would suppress them
        # inline, so they are excluded here. -confidence=medium drops a
        # LOW-confidence G101 false positive on a plaintext-warning message.
        run: |
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          gosec -confidence=medium -exclude=G204,G304 ./...

  govulncheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=go depName=golang.org/x/vuln
      GOVULNCHECK_VERSION: v1.8.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-govulncheck-${{ env.GOVULNCHECK_VERSION }}
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy -diff
        run: go mod tidy -diff
      - name: govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  go-licenses:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # renovate: datasource=go depName=github.com/google/go-licenses/v2
      GO_LICENSES_VERSION: v2.0.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-go-licenses-${{ env.GO_LICENSES_VERSION }}
      - name: install go-licenses
        run: go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
      - name: report dependency licenses
        run: go-licenses report ./...
      - name: check dependency licenses
        run: go-licenses check ./...
