name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions: {}
concurrency:
  # Static per-file group: a tag-push release run calls ci, security,
  # gitleaks and reuse together; a shared group with cancel-in-progress
  # made the siblings cancel each other, so each names its own group.
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=go depName=mvdan.cc/gofumpt
      GOFUMPT_VERSION: v0.12.0
      # renovate: datasource=go depName=honnef.co/go/tools
      STATICCHECK_VERSION: v0.8.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - uses: ./.github/actions/install-go-tool # zizmor: ignore[self-repository] actionlint v1.7.12 rejects the $/ form; keep ./ until actionlint accepts it
        with:
          module: mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
      - uses: ./.github/actions/install-go-tool # zizmor: ignore[self-repository] actionlint v1.7.12 rejects the $/ form; keep ./ until actionlint accepts it
        with:
          module: honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
      - name: gofumpt
        run: |
          unformatted=$(gofumpt -l .)
          test -z "$unformatted" || { echo "gofumpt needs to run on:"; echo "$unformatted"; exit 1; }
      - name: staticcheck
        run: staticcheck ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
          version: v2.14.0

  coverage:
    name: Coverage
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - run: go test -coverprofile=coverage.out ./...
      - name: go-test-coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

  actions:
    name: Actions
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=go depName=github.com/rhysd/actionlint
      ACTIONLINT_VERSION: v1.7.12
      # renovate: datasource=go depName=github.com/suzuki-shunsuke/pinact/v5
      PINACT_VERSION: v5.0.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - uses: ./.github/actions/install-go-tool # zizmor: ignore[self-repository] actionlint v1.7.12 rejects the $/ form; keep ./ until actionlint accepts it
        with:
          module: github.com/rhysd/actionlint/cmd/actionlint@${{ env.ACTIONLINT_VERSION }}
      - uses: ./.github/actions/install-go-tool # zizmor: ignore[self-repository] actionlint v1.7.12 rejects the $/ form; keep ./ until actionlint accepts it
        with:
          module: github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@${{ env.PINACT_VERSION }}
      - name: actionlint
        run: actionlint
      - name: pinact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "pinact: no workflow files found in .github/workflows" >&2
            exit 1
          fi
          pinact run --check --verify-comment "${files[@]}"
