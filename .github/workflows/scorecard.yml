name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  scorecard:
    name: Scorecard
    permissions:
      contents: read
      id-token: write # signs published Scorecard results
    uses: openbunny/.github/.github/workflows/reusable-scorecard.yml@2050692900f7dcd883e416ebee37a1b97b119203 # v0.3.0
    with:
      publish: true
