# Runs the gitleaks scanner directly via `go install`, not gitleaks/gitleaks-action:
# the action requires a paid GITLEAKS_LICENSE on a private repository, the open
# source scanner binary does not.
name: gitleaks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions: {}
concurrency:
  # Static per-file group: a tag-push release run calls ci, security,
  # gitleaks and reuse together; a shared group with cancel-in-progress
  # made the siblings cancel each other, so each names its own group.
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    name: Gitleaks
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=go depName=github.com/zricethezav/gitleaks/v8
      GITLEAKS_VERSION: v8.30.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - uses: ./.github/actions/install-go-tool # zizmor: ignore[self-repository] actionlint v1.7.12 rejects the $/ form; keep ./ until actionlint accepts it
        with:
          module: github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}
      - name: gitleaks
        run: gitleaks detect --source . --redact -v
