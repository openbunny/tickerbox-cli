name: Release
on:
  push:
    tags: ['v*']
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Builds a snapshot with goreleaser on every PR, without publishing, so a
  # broken .goreleaser.yaml or build fails before it reaches a tag push.
  snapshot:
    name: Snapshot
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - name: export SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.2
          args: release --snapshot --clean

  # A tagged commit is released only if every CI check on that exact commit
  # concluded successfully: CI failures must block the release, and a tag push
  # does not re-run CI, so the release job cannot publish on its own.
  verify:
    name: Gate release on CI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      checks: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the tagged commit's CI checks to have passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha='${{ github.sha }}'
          repo='${{ github.repository }}'
          for _ in $(seq 1 45); do
            json=$(gh api "repos/$repo/commits/$sha/check-runs" --paginate)
            total=$(jq '[.check_runs[]|select(.name|test("^(Gate release|Release|Snapshot)")|not)]|length' <<<"$json")
            running=$(jq '[.check_runs[]|select((.name|test("^(Gate release|Release|Snapshot)")|not) and .status!="completed")]|length' <<<"$json")
            if [ "$total" -gt 0 ] && [ "$running" -eq 0 ]; then
              failed=$(jq -r '[.check_runs[]|select((.name|test("^(Gate release|Release|Snapshot)")|not) and (.conclusion|IN("success","skipped","neutral")|not))|.name]|join(", ")' <<<"$json")
              if [ -n "$failed" ]; then
                echo "::error::refusing to release $sha; failing checks: $failed"
                exit 1
              fi
              echo "all $total CI checks green on $sha; release may proceed"
              exit 0
            fi
            echo "waiting for CI on $sha ($running of $total still running)"
            sleep 20
          done
          echo "::error::refusing to release $sha; CI checks did not complete or none were found"
          exit 1

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # goreleaser creates the GitHub Release and uploads its artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true
      - name: export SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
