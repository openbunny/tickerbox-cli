name: REUSE
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions: {}
concurrency:
  # Static per-file group: a tag-push release run calls ci, security,
  # gitleaks and reuse together; a shared group with cancel-in-progress
  # made the siblings cancel each other, so each names its own group.
  group: reuse-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reuse:
    name: REUSE
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
