# Release build. Runs only at tag time, deferred until public release is authorized.
version: 2
project_name: tickerbox-cli
before:
  hooks:
    - go run ./docs/gen -man
    - sh -c 'mkdir -p dist/completions && go run . completion bash > dist/completions/tickerbox.bash && go run . completion zsh > dist/completions/tickerbox.zsh && go run . completion fish > dist/completions/tickerbox.fish && go run . completion powershell > dist/completions/tickerbox.ps1'
    # docs/gen and the completions above write into dist/, but goreleaser's
    # own "ensure ./dist exists and is empty" check runs immediately after
    # these hooks and fails if dist/ is non-empty, so the generated files
    # are relocated out of dist/ before that check runs.
    - sh -c 'rm -rf manpages completions && mv dist/man manpages && mv dist/completions completions && rm -rf dist'
builds:
  - id: tickerbox
    main: .
    binary: tickerbox
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/openbunny/tickerbox-cli/cmd.version={{.Version}}
      - -X github.com/openbunny/tickerbox-cli/cmd.commit={{.Commit}}
      - -X github.com/openbunny/tickerbox-cli/cmd.date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # Pins the binary's embedded mtime to the source commit instead of build
    # wall-clock time, so two builds of the same commit produce identical
    # bytes. CI must also export SOURCE_DATE_EPOCH (commit timestamp) so
    # syft and nfpm below apply the same mtime to the files they emit.
    mod_timestamp: '{{ .CommitTimestamp }}'
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - NOTICE
      - LICENSES/*
checksum:
  name_template: checksums.txt
sboms:
  - id: archive
    artifacts: archive
    cmd: syft
    args:
      - '$artifact'
      - --output
      - 'cyclonedx-json=$document'
# Signs checksums.txt with cosign key-based signing (not keyless: this repo
# is private, and Fulcio/Rekor keyless signing needs public OIDC/transparency
# log access). Required Actions secret: COSIGN_PRIVATE_KEY, a PEM-encoded
# cosign private key generated with `cosign generate-key-pair` and stored
# only as a secret, never committed. Optional Actions secret:
# COSIGN_PASSWORD, if that key was generated with a password.
signs:
  - id: checksums
    cmd: cosign
    signature: '${artifact}.bundle'
    args:
      - sign-blob
      - --key=env://COSIGN_PRIVATE_KEY
      - --bundle=${signature}
      # cosign's new bundle format otherwise requires reaching Fulcio/Rekor
      # even for key-based signing; both flags are deprecated but still
      # honored, and there is no non-deprecated way to keep this offline.
      - --use-signing-config=false
      - --tlog-upload=false
      - --yes
      - ${artifact}
    artifacts: checksum
nfpms:
  - id: tickerbox
    package_name: tickerbox-cli
    file_name_template: '{{ .ConventionalFileName }}'
    vendor: OpenBunny
    homepage: https://github.com/openbunny/tickerbox-cli
    maintainer: 'OpenBunny <https://github.com/openbunny>'
    description: Command-line client for a TickerBox device's REST API.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    contents:
      - src: LICENSE
        dst: /usr/share/doc/tickerbox-cli/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/tickerbox-cli/NOTICE
      - src: LICENSES/*
        dst: /usr/share/doc/tickerbox-cli/LICENSES
      - src: manpages/*
        dst: /usr/share/man/man1
      - src: completions/tickerbox.bash
        dst: /usr/share/bash-completion/completions/tickerbox
      - src: completions/tickerbox.zsh
        dst: /usr/share/zsh/site-functions/_tickerbox
      - src: completions/tickerbox.fish
        dst: /usr/share/fish/vendor_completions.d/tickerbox.fish
release:
  draft: false
  prerelease: auto
homebrew_casks:
  - repository:
      owner: OA
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    name: tickerbox-cli
    binaries:
      - tickerbox
    homepage: https://github.com/openbunny/tickerbox-cli
    description: Command-line client for a TickerBox device's REST API.
    commit_author:
      name: Robot
      email: bot@fiona.sm
